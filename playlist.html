<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>پلی لیست</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/playlist.css">
    <link rel="stylesheet" href="css/rows.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <div
        id="header"
        data-component="components/header.html">
    </div>

    <main class="page">

        <div class="playlist-container">

            <!-- ================= PLAYLIST HEADER ================= -->

            <section class="playlist-header">

                <div class="playlist-cover">
                    <img id="playlist-cover" src="" alt="کاور پلی لیست">
                </div>

                <h1 id="playlist-title">
                    پلی لیست
                </h1>

                <div class="playlist-count" id="playlist-count">
                    ۰ صوت · ۰ ویدئو
                </div>
<div class="playlist-header-actions">

    <button
        type="button"
        class="playlist-header-action playlist-share-button"
        title="اشتراک‌گذاری مجموعه">

        <i class="fa-solid fa-share-nodes"></i>

    </button>

    <button
        type="button"
        class="playlist-header-action playlist-save-button"
        title="ذخیره مجموعه">

        <i class="fa-regular fa-bookmark"></i>

    </button>

</div>
            </section>


            <!-- ================= CONTENT LIST ================= -->

            <div id="playlist-content"></div>

            <div id="playlist-items"></div>

            </section>

        </div>

        <!-- =====================================================
            SIMILAR PLAYLISTS
        ====================================================== -->
        <section class="content-group">
            <section class="content-row">

                <div class="content-row-header">

                    <h2 data-content-info="topic">
                        مجموعه‌های مشابه
                    </h2>

                    <a
                        href="results.html?format=playlist"
                        class="view-all"
                    >
                        مشاهده همه

                        <i class="fa-solid fa-arrow-left"></i>
                    </a>

                </div>


                <div
                    class="content-slider"
                    data-xml="data/playlists.xml"
                    data-type="playlist"
                ></div>

            </section>
        </section>
    </main>


    <!-- Footer -->
    <div
        id="footer"
        data-component="components/footer.html">
    </div>

    <script src="js/global.js"></script>
    <script src="js/playlist.js"></script>
    <script src="js/playlist-actions.js"></script>
    <script src="js/cards.js"></script>
    <script src="js/rows.js"></script>
</body>

</html>
