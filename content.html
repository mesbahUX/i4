<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>محتوا | سامانه مصباح</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/content.css">
    <link rel="stylesheet" href="css/video-side-row.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>

    <!-- ================= HEADER ================= -->

    <div
        id="header"
        data-component="components/header.html">
    </div>


    <!-- ================= CONTENT ================= -->

    <main class="page">


        <!-- =====================================================
             VIDEO
        ====================================================== -->

        <section id="video-layout"
                 class="content-main video-layout">

            <!-- VIDEO -->
            <div class="video-section">
                <div class="video-content-column">

                        <!-- <div class="video-box">

                            <video id="content-video"
                                controls
                                playsinline>

                                <source id="video-source"
                                        src=""
                                        type="video/mp4">

                                مرورگر شما از پخش ویدیو پشتیبانی نمی‌کند.

                            </video>

                        </div> -->

                        <div class="video-box custom-video-player">

                            <video
                                id="content-video"
                                playsinline>
                            </video>


                            <!-- CENTER PLAY -->

                            <button
                                id="video-play"
                                type="button"
                                class="video-center-play">

                                <i class="fa-solid fa-play"></i>

                            </button>


                            <!-- VIDEO CONTROLS -->

                            <div class="video-controls">

                                <!-- PROGRESS -->

                                <div class="video-progress-wrapper">

                                    <input
                                        id="video-progress"
                                        type="range"
                                        min="0"
                                        max="100"
                                        value="0">

                                </div>


                                <div class="video-control-row">

                                    <!-- RIGHT SIDE -->

                                    <div class="video-controls-right">

                                        <button
                                            id="video-control-play"
                                            type="button"
                                            class="video-control-button">

                                            <i class="fa-solid fa-play"></i>

                                        </button>


                                        <button
                                            id="video-skip-backward"
                                            type="button"
                                            class="video-control-button video-skip">

                                            <span>10</span>
                                            <i class="fa-solid fa-rotate-left"></i>

                                        </button>


                                        <button
                                            id="video-skip-forward"
                                            type="button"
                                            class="video-control-button video-skip">

                                            <i class="fa-solid fa-rotate-right"></i>
                                            <span>10</span>

                                        </button>


                                        <button
                                            id="video-mute"
                                            type="button"
                                            class="video-control-button">

                                            <i class="fa-solid fa-volume-high"></i>

                                        </button>


                                        <input
                                            id="video-volume"
                                            class="video-volume"
                                            type="range"
                                            min="0"
                                            max="1"
                                            step="0.05"
                                            value="1">


                                        <span
                                            id="video-current-time"
                                            class="video-time">
                                            00:00
                                        </span>

                                        <span class="video-time-separator">
                                            /
                                        </span>

                                        <span
                                            id="video-duration"
                                            class="video-time">
                                            00:00
                                        </span>

                                    </div>


                                    <!-- LEFT SIDE -->

                                    <div class="video-controls-left">
                                        <button
                                            id="video-pip"
                                            class="video-control-button"
                                            type="button"
                                            title="پنجره شناور"
                                        >
                                            <i class="fa-solid fa-clone"></i>
                                        </button>
                                        <div class="video-speed-control">

                                            <button
                                                id="video-speed"
                                                class="video-control-button"
                                                type="button"
                                            >
                                                1x
                                            </button>

                                            <div
                                                id="video-speed-menu"
                                                class="video-speed-menu"
                                            >
                                                <button data-speed="0.5">0.5x</button>
                                                <button data-speed="0.75">0.75x</button>
                                                <button data-speed="1">1x</button>
                                                <button data-speed="1.25">1.25x</button>
                                                <button data-speed="1.5">1.5x</button>
                                                <button data-speed="1.75">1.75x</button>
                                                <button data-speed="2">2x</button>
                                            </div>

                                        </div>
                                        <button
                                            id="video-fullscreen"
                                            type="button"
                                            class="video-control-button">

                                            <i class="fa-solid fa-expand"></i>

                                        </button>

                                    </div>

                                </div>

                            </div>

                        </div>

                        <!-- VIDEO INFORMATION -->

                        <div class="video-information">

                            <!-- TITLE -->


                            <h1 id="video-title"></h1>

                            <!-- ACTIONS -->

                            <div class="content-actions video-actions">

                                <button type="button"
                                        class="content-action download-button">

                                    <i class="fa-solid fa-download"></i>
                                    <span>دانلود</span>

                                </button>

                                <button type="button"
                                        class="content-action share-button">

                                    <i class="fa-solid fa-share-nodes"></i>
                                    <span>اشتراک گذاری</span>

                                </button>

                                <button type="button"
                                        class="content-action save-action">

                                    <i class="fa-regular fa-bookmark"></i>
                                    <span>ذخیره</span>

                                </button>

                                <button type="button"
                                        class="content-action copy-link-action">

                                    <i class="fa-regular fa-copy"></i>
                                    <span>کپی لینک</span>

                                </button>
<button type="button"
        class="content-action question-action">

    <i class="fa-regular fa-circle-question"></i>
    <span>پرسش سؤال</span>

</button>
                            </div>

                            <div class="video-divider"></div>

                            <!-- SPEAKER -->


                            <span id="video-speaker"
                            class="speaker-profile"
                            href="#">

                                <div id="speaker-avatar"
                                    class="speaker-avatar">

                                    <span id="speaker-initial"></span>

                                </div>

                                <span id="video-speaker-name"></span>

                            </span>


                            <!-- TRANSCRIPT -->

                            <section id="video-transcript-section"
                                    class="transcript-section">

                                <div id="video-transcript"
                                    class="transcript-text collapsed">
                                </div>

                                <!-- <button id="video-transcript-more"
                                        class="transcript-more"
                                        type="button">

                                    بیشتر

                                    <i class="fa-solid fa-chevron-down"></i>

                                </button> -->

                            </section>

                            <!-- TAGS -->

                            <div id="video-topic"
                                class="content-tags">
                            </div>
                        </div>
                </div>

                <div class="video-side-row">
                    <h2 data-content-info="topic">
                        ویدیو‌های مشابه درباره‌ی
                    </h2>
                </div>
            </div>



            <div class="content-divider"></div>

            <!-- =================================================
                    AUDIO WITH VIDEO
            ================================================== -->

            <section id="video-audio-section"
                    class="audio-layout">

                <!-- <div class="audio-cover-container">

                    <img id="video-audio-cover"
                        class="audio-cover"
                        src=""
                        alt="">

                </div> -->

                <div class="audio-information">

                    <h2 id="video-audio-title"></h2>
                </div>


                <div class="audio-player">

                    <audio id="video-audio">

                        <source id="video-audio-source"
                                src=""
                                type="audio/mpeg">

                    </audio>


                    <div class="audio-progress">

                        <span id="video-audio-current">
                            00:00
                        </span>

                        <input id="video-audio-progress"
                            type="range"
                            min="0"
                            max="100"
                            value="0">

                        <span id="video-audio-duration">
                            00:00
                        </span>
<div class="audio-speed-control">

    <button
        id="video-audio-speed"
        class="audio-control"
        type="button"
    >
        1x
    </button>

    <div
        id="video-audio-speed-menu"
        class="audio-speed-menu"
    >
        <button type="button" data-speed="0.5">0.5x</button>
        <button type="button" data-speed="0.75">0.75x</button>
        <button type="button" data-speed="1">1x</button>
        <button type="button" data-speed="1.25">1.25x</button>
        <button type="button" data-speed="1.5">1.5x</button>
        <button type="button" data-speed="1.75">1.75x</button>
        <button type="button" data-speed="2">2x</button>
    </div>

</div>
                    </div>


                    <div class="audio-controls">

                        <button id="video-audio-prev"
                                type="button"
                                class="audio-control audio-skip">

                            <i class="fa-solid fa-rotate-left"></i>
                            <span>10</span>

                        </button>

                        <button id="video-audio-play"
                                type="button"
                                class="audio-play">

                            <i class="fa-solid fa-play"></i>

                        </button>

                        <button id="video-audio-next"
                                type="button"
                                class="audio-control audio-skip">

                            <i class="fa-solid fa-rotate-right"></i>
                            <span>10</span>

                        </button>

                    </div>

                </div>


                <div class="content-actions audio-actions">

                    <button type="button"
                            class="content-action download-button">

                        <i class="fa-solid fa-download"></i>
                        <span>دانلود</span>

                    </button>

                    <button type="button"
                            class="content-action share-button">

                        <i class="fa-solid fa-share-nodes"></i>
                        <span>اشتراک گذاری</span>

                    </button>
<!-- <button type="button"
        class="content-action question-action">

    <i class="fa-regular fa-circle-question"></i>
    <span>پرسش سؤال</span>

</button> -->
                    <!-- <button type="button"
                            class="content-action save-action">

                        <i class="fa-regular fa-bookmark"></i>
                        <span>ذخیره</span>

                    </button> -->

                    <!-- <button type="button"
                            class="content-action copy-link-action">

                        <i class="fa-regular fa-copy"></i>
                        <span>کپی لینک</span>

                    </button> -->

                </div>
                
                <div class="content-divider"></div> 
            </section>

        </section>


        <!-- =====================================================
             AUDIO 
        ====================================================== -->

        <section id="audio-layout"
                 class="content-main audio-layout">

            <div class="audio-cover-container">

                <img id="audio-cover"
                     class="audio-cover"
                     src=""
                     alt="">

            </div>


            <div class="audio-information">

                <!-- TITLE -->
                <h1 id="audio-title"></h1>

                <!-- PLAYER -->
                <div class="audio-player">

                    <audio id="content-audio">

                        <source id="audio-source"
                                src=""
                                type="audio/mpeg">

                    </audio>


                    <div class="audio-progress">

                        <span id="audio-current">
                            00:00
                        </span>


                        <input id="audio-progress-bar"
                               type="range"
                               min="0"
                               max="100"
                               value="0">


                        <span id="audio-duration">
                            00:00
                        </span>
<div class="audio-speed-control">

    <button
        id="audio-speed"
        class="audio-control"
        type="button"
    >
        1x
    </button>

    <div
        id="audio-speed-menu"
        class="audio-speed-menu"
    >
        <button type="button" data-speed="0.5">0.5x</button>
        <button type="button" data-speed="0.75">0.75x</button>
        <button type="button" data-speed="1">1x</button>
        <button type="button" data-speed="1.25">1.25x</button>
        <button type="button" data-speed="1.5">1.5x</button>
        <button type="button" data-speed="1.75">1.75x</button>
        <button type="button" data-speed="2">2x</button>
    </div>

</div>
                    </div>


                    <div class="audio-controls">

                        <button id="audio-prev"
                                type="button"
                                class="audio-control audio-skip">

                            <i class="fa-solid fa-rotate-left"></i>
                            <span>10</span>

                        </button>


                        <button id="audio-play"
                                type="button"
                                class="audio-play">

                            <i class="fa-solid fa-play"></i>

                        </button>


                        <button id="audio-next"
                                type="button"
                                class="audio-control audio-skip">

                            <i class="fa-solid fa-rotate-right"></i>
                            <span>10</span>

                        </button>

                    </div>

                </div>

                <!-- ACTIONS -->
                <div class="content-actions audio-actions">

                    <button type="button"
                            class="content-action download-button">

                        <i class="fa-solid fa-download"></i>
                        <span>دانلود</span>

                    </button>

                    <button type="button"
                            class="content-action share-button">

                        <i class="fa-solid fa-share-nodes"></i>
                        <span>اشتراک گذاری</span>

                    </button>

                    <button type="button"
                            class="content-action save-action">

                        <i class="fa-regular fa-bookmark"></i>
                        <span>ذخیره</span>

                    </button>
<button type="button"
        class="content-action question-action">

    <i class="fa-regular fa-circle-question"></i>
    <span>پرسش سؤال</span>

</button>
                    <!-- <button type="button"
                            class="content-action copy-link-action">

                        <i class="fa-regular fa-copy"></i>
                        <span>کپی لینک</span>

                    </button> -->

                </div>

                <!-- SPEAKER -->
                <span id="audio-speaker"
                class="speaker-profile">

                    <div id="speaker-avatar"
                        class="speaker-avatar">

                        <span id="audio-speaker-initial"></span>
                    </div>

                    <span id="audio-speaker-name"></span>

                </span>

                <!-- TRANSCRIPT -->
                <section id="audio-transcript-section"
                         class="transcript-section">

                    <div id="audio-transcript"
                         class="transcript-text collapsed">
                    </div>


                    <!-- <button id="audio-transcript-more"
                            class="transcript-more"
                            type="button">

                        بیشتر

                        <i class="fa-solid fa-chevron-down"></i>

                    </button> -->

                </section>

                <!-- TAGS -->
                <div id="audio-tags"
                     class="content-tags audio-tags">
                </div>
            </div>

            <div class="content-divider"></div>

        </section>

        <section class="content-group">
            <!-- ---------------- VIDEO ---------------- -->
            <section class="content-row">

                <div class="content-row-header">

                    <h2 data-content-info="topic">
                        ویدیو‌های مشابه درباره‌ی
                    </h2>

                    <a
                        href="#"
                        class="view-all"
                    >
                        مشاهده همه

                        <i class="fa-solid fa-arrow-left"></i>
                    </a>

                </div>


                <div
                    class="content-slider"
                    data-xml="data/contents2.xml"
                    data-type="video"
                    data-ids="1-8"
                    data-filter="topic"
                ></div>

            </section>

            <!-- ---------------- AUDIO ---------------- -->
            <section class="content-row">

                <div class="content-row-header">

                    <h2 data-content-info="topic">
                        صوت‌های مشابه درباره‌ی
                    </h2>

                    <a
                        href="#"
                        class="view-all"
                    >
                        مشاهده همه

                        <i class="fa-solid fa-arrow-left"></i>
                    </a>

                </div>


                <div
                    class="content-slider"
                    data-xml="data/contents2.xml"
                    data-type="audio"
                    data-ids="15-30"
                    data-filter="topic"
                ></div>

            </section>

            <!-- -------------- PLAYLISTS -------------- -->
            <section class="content-row">

                <div class="content-row-header">

                    <h2>
                        مجموعه‌های مرتبط
                    </h2>

                    <a
                        href="#"
                        class="view-all"
                    >
                        مشاهده همه

                        <i class="fa-solid fa-arrow-left"></i>
                    </a>

                </div>


                <div
                    class="content-slider"
                    data-xml="data/playlists.xml"
                    data-type="playlist"
                    data-filter="topic"
                ></div>

            </section>

            <!-- ---------------- VIDEO ---------------- -->
            <section class="content-row">

                <div class="content-row-header">

                    <h2 data-content-info="speaker">
                        ویدیو‌های دیگر از
                    </h2>

                    <a
                        href="#"
                        class="view-all"
                    >
                        مشاهده همه

                        <i class="fa-solid fa-arrow-left"></i>
                    </a>

                </div>


                <div
                    class="content-slider"
                    data-xml="data/contents2.xml"
                    data-type="video"
                    data-ids="9-15"
                    data-filter="speaker"
                ></div>

            </section>

            <!-- ---------------- AUDIO ---------------- -->
            <section class="content-row">

                <div class="content-row-header">

                    <h2 data-content-info="speaker">
                        صوت‌های دیگر از
                    </h2>

                    <a
                        href="#"
                        class="view-all"
                    >
                        مشاهده همه

                        <i class="fa-solid fa-arrow-left"></i>
                    </a>

                </div>


                <div
                    class="content-slider"
                    data-xml="data/contents2.xml"
                    data-type="audio"
                    data-ids="30-39"
                    data-filter="speaker"
                ></div>

            </section>
        </section>
    </main>

    <!-- Footer -->
    <div
        id="footer"
        data-component="components/footer.html">
    </div>
    
    <!-- ================= JS ================= -->

    <script src="js/global.js"></script>
    <script src="js/content.js"></script>
    <script src="js/content-actions.js"></script>
    <script src="js/cards.js"></script>
    <script src="js/rows.js"></script>
    <script src="js/video-side-row.js"></script>

</body>

</html>
